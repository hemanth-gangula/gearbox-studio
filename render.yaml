services:
  - type: web
    name: gearbox-studio-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PROJECTS_DIR
        value: /app/projects
      # Set ALLOWED_ORIGINS to your Vercel frontend URL after deploying
      # e.g. https://gearbox-studio.vercel.app
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000
    disk:
      name: projects-data
      mountPath: /app/projects
      sizeGB: 1
