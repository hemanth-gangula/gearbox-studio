services:
  - type: web
    name: gearbox-studio-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PROJECTS_DIR
        value: /tmp/projects
      - key: ALLOWED_ORIGINS
        value: https://gearbox-studio-orpin.vercel.app
